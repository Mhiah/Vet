name: Extra experiments
# Runs scripts/extra.sh. Starts when the EXTRA file changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [EXTRA]
permissions:
  contents: write
concurrency:
  group: run-study
  cancel-in-progress: false
env:
  CRUX_COMMIT: 359a6f47805b97c594a59a431125730b4520e983
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mhiah/crux
          ref: ${{ env.CRUX_COMMIT }}
          path: crux
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: crux
        run: npm ci
      - name: Run scripts/extra.sh
        working-directory: crux
        run: bash ../scripts/extra.sh
        env:
          VET_ROOT: ${{ github.workspace }}
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "Mhiah"
          git config user.email "192190660+Mhiah@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "results: add extra experiment runs [skip ci]"
          git pull --rebase
          git push
